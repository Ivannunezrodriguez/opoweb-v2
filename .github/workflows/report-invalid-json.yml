name: Diagnosticar JSON

on:
  push:
    paths:
      - tools/report-invalid-json.mjs
      - .github/workflows/report-invalid-json.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node tools/report-invalid-json.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JSON_ERRORS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: informa JSON inválidos"
          git push
