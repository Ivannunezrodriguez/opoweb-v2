name: Validar OpoWeb v2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Comprobar sintaxis de la interfaz
        run: |
          node --check assets/app.js
          node --check assets/practice.js
      - name: Validar 162 repasos UC3M y conexión a la interfaz
        run: node tests/validate-uc3m-extra-repasos-20261106.mjs
      - name: Comprobar cierres documentales UC3M T09 y T12
        run: node tests/validate-uc3m-cierres-documentales-20261106.mjs
      - name: Comprobar cierre documental UC3M T10 y T11
        run: node tests/validate-uc3m-cierres-t10-t11-20261106.mjs
      - name: Comprobar cierre documental UC3M T13 y T14 LOSU
        run: node tests/validate-uc3m-cierres-t13-t14-20261106.mjs
      - name: Comprobar cierre documental UC3M T15 Estatutos y 178.3
        run: node tests/validate-uc3m-cierre-t15-20261106.mjs
      - name: Comprobar cierre documental UC3M T16 ensenanzas y BOEL 2026
        run: node tests/validate-uc3m-cierre-t16-20261106.mjs
      - name: Comprobar cierre documental UC3M T17 acceso y admision
        run: node tests/validate-uc3m-cierre-t17-20261106.mjs
      - name: Comprobar cierre documental UC3M T18 presupuesto
        run: node tests/validate-uc3m-cierre-t18-20261106.mjs
      - name: Comprobar cierre documental UC3M T19 gasto y pago
        run: node tests/validate-uc3m-cierre-t19-20261106.mjs
      - name: Comprobar cierre documental UC3M T20 contratos LCSP
        run: node tests/validate-uc3m-cierre-t20-20261106.mjs
      - name: Verificar menú adaptable e integración OpoRadar
        run: node tests/validate-portal-navigation.mjs
      - name: Validar programa y bancos de La Puebla
        run: node tests/validate.mjs
      - name: Validar maquetación editorial de La Puebla
        run: node tests/validate-la-puebla-editorial.mjs
      - name: Validar repaso juridico urgente La Puebla T01 a T04
        run: node tests/validate-la-puebla-repaso-t01-t04-20261106.mjs
      - name: Comprobar reforma LRBRL La Puebla tema 05 y banco
        run: node tests/validate-la-puebla-reforma-t05-20261106.mjs
      - name: Validar repaso La Puebla T06 T07 T08 empleo PRL igualdad
        run: node tests/validate-la-puebla-repaso-t06-t08-20261106.mjs
      - name: Validar repaso La Puebla T09 T10 T11 T12 datos y tributos
        run: node tests/validate-la-puebla-repaso-t09-t12-20261107.mjs
      - name: Verificar 7 repasos de La Puebla T13-T19 y 84 preguntas originales
        run: node tests/validate-la-puebla-repasos-t13-t19-20261107.mjs
      - name: Verificar las 144 alternativas tributarias de La Puebla T10 T11 T12
        run: node tests/validate-la-puebla-t10-t11-t12-integral.mjs
      - name: Verificar las 144 alternativas jurídicas de La Puebla T3 T5 y T6
        run: node tests/validate-la-puebla-t03-t05-t06-integral.mjs
      - name: Verificar las 144 alternativas jurídicas de La Puebla T1 T8 y T9
        run: node tests/validate-la-puebla-three-audits-november.mjs
      - name: Verificar las 144 alternativas jurídicas de La Puebla T2 T4 y T14
        run: node tests/validate-la-puebla-three-legal-closures.mjs
      - name: Verificar 48 alternativas legales del Tema 7 La Puebla
        run: node tests/validate-la-puebla-t07-integral.mjs
      - name: Verificar las 48 alternativas con fundamento jurídico del Tema 13 La Puebla
        run: node tests/validate-la-puebla-t13-integral.mjs
      - name: Validar las 240 opciones de Windows, Office y periféricos de La Puebla
        run: node tests/validate-la-puebla-t15-t19-integral.mjs
      - name: Validar distribución de 228 respuestas de La Puebla
        run: node tests/validate-la-puebla-answer-distribution.mjs
      - name: Validar cifras y plazos normativos focales de La Puebla
        run: node tests/validate-la-puebla-normativa-focal.mjs
      - name: Validar fuentes oficiales y enlaces de 14 temas de La Puebla
        run: node tests/validate-sources.mjs
      - name: Validar progreso independiente y blancos de tres convocatorias
        run: node tests/validate-practice-progress-isolation-20261107.mjs
      - name: Comprobar modalidades La Puebla 3 breves y 2 oficiales 50+5
        run: node tests/validate-la-puebla-simulacro-metadata-20261107.mjs
      - name: Validar motor de simulacros de La Puebla
        run: node tests/validate-practice-exam.mjs
      - name: Comprobar rutas a temas sin preguntas disponibles
        run: node tests/validate-practice-empty-theme-20261109.mjs
      - name: Verificar exclusión de tres temas bloqueados y simulacros Olías
        run: node tests/validate-practice-blocked-themes-20261109.mjs
      - name: Probar cargas simultáneas de convocatorias sin mezcla de bancos
        run: node tests/validate-practice-concurrent-calls-20261109.mjs
      - name: Comprobar calificación y etiqueta de primer ejercicio La Puebla
        run: node tests/validate-la-puebla-primer-ejercicio-20261109.mjs
      - name: Verificar 144 alternativas legales UC3M T1 T2 T3
        run: node tests/validate-uc3m-t01-t03-integral.mjs
      - name: Comprobar UC3M T5 artículo 46bis y T6 fecha de corte
        run: node tests/validate-uc3m-t05-46bis-and-t06-cutoff.mjs
      - name: Validar 144 alternativas legales UC3M T4 T5 y T6
        run: node tests/validate-uc3m-t04-t06-integral.mjs
      - name: Comprobar 144 alternativas UC3M T7 T8 T9
        run: node tests/validate-uc3m-t07-t09-integral.mjs
      - name: Validar UC3M temas 10-12 y 144 opciones jurídicas
        run: node tests/validate-uc3m-t10-t12-integral.mjs
      - name: Verificar 188 alternativas exactas UC3M T13-T15
        run: node tests/validate-uc3m-t13-t15-integral.mjs
      - name: Verificar fuentes UC3M tema 16 para matricula permanencia y evaluacion
        run: node tests/validate-uc3m-t16-source-attribution-20261107.mjs
      - name: Verificar 276 alternativas jurídicas y presupuestarias UC3M T16-T20
        run: node tests/validate-uc3m-t16-t20-integral.mjs
      - name: Verificar distribución de 260 claves UC3M
        run: node tests/validate-uc3m-answer-distribution.mjs
      - name: Verificar literalidad, unicidad y excepciones en tres temas prioritarios
        run: node tests/validate-priority-three-topics.mjs
      - name: Verificar reforma 2009 del cese del Defensor UC3M
        run: node tests/validate-uc3m-statutes-cese.mjs
      - name: Validar 3 simulacros UC3M 70+5 y puntuación directa
        run: node tests/validate-uc3m-exams.mjs
      - name: Comprobar distribución de 803 respuestas de Diputación C1
        run: node tests/validate-diputacion-c1-answer-distribution.mjs
      - name: Validar programa y preguntas de Diputación C1
        run: node tests/validate-diputacion.mjs
      - name: Validar cierres C1 1-27 y el banco 24-27 con pruebas historicas por lote
        run: |
          node tests/validate-diputacion-c1-bloque-01-03-20261105.mjs
          node tests/validate-diputacion-c1-t04-t07-cierre-20261105.mjs
          node tests/validate-diputacion-c1-t08-t11-cierre-20261105.mjs
          node tests/validate-diputacion-c1-t12-t15-cierre-20261105.mjs
          node tests/validate-diputacion-c1-t16-t19-cierre-20261105.mjs
          node tests/validate-diputacion-c1-t20-t23-cotejo-20261105.mjs
          node tests/validate-diputacion-c1-t24-t27-cierre-20261105.mjs
      - name: Verificar reforma OAPGT 2011 y mantener reservas de los tres temas bloqueados
        run: node tests/validate-oapgt-fuentes-primarias-20261109.mjs
      - name: Verificar OAPGT BOP 2023 y prevenir certificación sin estatutos
        run: node tests/validate-oapgt-contratacion-2023-20261109.mjs
      - name: Validar estructura conjunta de 121 temas de cinco convocatorias
        run: node tests/validate-all-programmes.mjs
      - name: Auditar los 121 manuales, matrices y bancos de preguntas
        run: node tools/audit-121-structural.mjs
      - name: Conservar informe estructural 121 temas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-121-structural
          path: audit/generated/audit-121-structural.json
          if-no-files-found: warn
      - name: Cotejar 80 alternativas de empleo publico Castilla-La Mancha Diputacion C2 T7
        run: node tests/validate-diputacion-c2-t7-integral.mjs
      - name: Cotejar 240 alternativas y 10 mejoras tributarias de Diputacion C2 temas 11-13
        run: node tests/validate-diputacion-c2-t11-t13-integral.mjs
      - name: Certificar cierre documental actualizado de Diputación C2 11-13 y sus 240 opciones
        run: node tests/validate-diputacion-c2-t11-t13-cierre-20261106.mjs
      - name: Certificar cierre documental de Diputación C2 14-16 y sus 240 opciones
        run: node tests/validate-diputacion-c2-t14-t16-cierre-20261106.mjs
      - name: Cotejar 240 alternativas y 7 reparaciones de Diputacion C2 temas 8-10
        run: node tests/validate-diputacion-c2-t08-t10-integral.mjs
      - name: Auditar 160 alternativas exactas y paridad LOREG 2024 de Diputación C2 temas 4-5
        run: node tests/validate-diputacion-c2-t4-t5-integral.mjs
      - name: Auditar 240 alternativas exactas de Diputación C2 temas 1-3
        run: node tests/validate-diputacion-c2-t1-t3-integral.mjs
      - name: Comprobar matrices oficiales de Diputación C2 en cinco temas prioritarios
        run: node tests/validate-diputacion-c2-matrices.mjs
      - name: Verificar LPRL C2 tema 8 (recuento de delegados, informe y definición)
        run: node tests/validate-diputacion-c2-prl-focal.mjs
      - name: Validar coherencia de cinco convocatorias y campos de preguntas
        run: node tests/validate-cross-oposiciones.mjs
      - name: Validar nuevo temario Olías C2 (22 temas, desarrollo progresivo)
        run: node tests/validate-olias-programme.mjs
      - name: Validar simulacros Olías 50+20, psicotécnicos y puntuación separada
        run: node tests/validate-olias-practice.mjs
      - name: Validar Radar de empleo (sin consultar la red)
        run: |
          node --check assets/radar.js
          node --check tools/radar-enrich.mjs
          node --check tools/radar.mjs
          node --check tools/radar-notify.mjs
          node tests/radar-fixtures.mjs
          node tests/radar-enrich.mjs
          python3 tests/radar-direct-test.py

