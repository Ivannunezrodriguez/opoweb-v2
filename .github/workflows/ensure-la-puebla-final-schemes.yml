name: Completar esquemas finales de La Puebla

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/ensure-la-puebla-final-schemes.mjs'
      - '.github/workflows/ensure-la-puebla-final-schemes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Añadir esquemas finales
        run: node tools/ensure-la-puebla-final-schemes.mjs
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add content/la-puebla/tema-08/manual.md content/la-puebla/tema-13/manual.md content/la-puebla/tema-14/manual.md
          if git diff --cached --quiet; then
            echo "No hay cambios"
            exit 0
          fi
          git commit -m "feat: completa esquemas finales de los temas 8 13 y 14"
          git push
