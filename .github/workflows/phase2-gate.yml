name: Puerta de cierre Fase 2

# Esta puerta es una comprobación histórica; el CI continuo es validate.yml.
# No debe escribir diagnósticos en main: otras auditorías actualizan la rama
# mientras corre y producirían errores de git push non-fast-forward.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Ejecutar validación completa
        shell: bash
        run: |
          set +e
          npm run test:all > phase2-test-output.txt 2>&1
          code=$?
          cat phase2-test-output.txt
          echo "# Diagnóstico fase 2" > phase2-ci-result.md
          echo "Commit validado: $GITHUB_SHA" >> phase2-ci-result.md
          echo "Fecha UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> phase2-ci-result.md
          echo "Código final: $code" >> phase2-ci-result.md
          cat phase2-test-output.txt >> phase2-ci-result.md
          exit "$code"
      - name: Conservar diagnóstico como artefacto del workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2-diagnostico
          path: |
            phase2-ci-result.md
            phase2-test-output.txt
          retention-days: 14
