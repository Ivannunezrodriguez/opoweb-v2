name: Radar correo de prueba
on:
  push:
    branches: [feature/radar-empleo-publico]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje de prueba
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RADAR_EMAIL: ${{ secrets.RADAR_EMAIL }}
          RADAR_FROM: ${{ secrets.RADAR_FROM }}
        run: |
          node --input-type=module <<'JS'
          if (!process.env.RESEND_API_KEY || !process.env.RADAR_EMAIL) throw new Error('Faltan secretos de correo');
          const r = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.RESEND_API_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: process.env.RADAR_FROM || 'OpoWeb Radar <onboarding@resend.dev>',
              to: [process.env.RADAR_EMAIL],
              subject: 'OpoWeb Radar — prueba de notificación',
              text: 'Esta es una prueba del correo del Radar. No corresponde a una convocatoria.'
            })
          });
          if (!r.ok) throw new Error(`Resend HTTP ${r.status}: ${await r.text()}`);
          console.log('Resend aceptó el envío de prueba.');
          JS
