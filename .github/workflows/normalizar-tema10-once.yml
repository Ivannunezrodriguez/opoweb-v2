name: Normalizar Tema 10 una vez

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalizar-tema10-once.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correcciones verificadas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manual_path = Path('content/la-puebla/tema-10/manual.md')
          text = manual_path.read_text(encoding='utf-8')
          original = text

          old_header = """# La Puebla de Montalbán · Tema 10 · Manual reconstruido

**Estado:** APROBADO POR EL USUARIO  
**Publicado tras aprobación expresa.**  
**Fecha de revisión normativa:** 17 de julio de 2026.  
**Aprobado por el usuario:** 17 de julio de 2026.
"""
          new_header = """# Tema 10 · Principios de tributación local

**Estado editorial:** `PUBLICADO`  
**Fecha de revisión normativa:** 27 de julio de 2026.
"""
          if old_header not in text:
              raise SystemExit('No se encontró la cabecera esperada del Tema 10')
          text = text.replace(old_header, new_header, 1)
          text = text.replace('\n# PARTE ', '\n## PARTE ')
          text, n = re.subn(r'\n## 64\. Estado real\n.*\Z', '\n', text, flags=re.S)
          if n != 1:
              raise SystemExit(f'No se pudo retirar el apartado Estado real: coincidencias={n}')
          if 'Preguntas trazables: no creadas todavía' in text:
              raise SystemExit('Persistió la contradicción del banco de preguntas')
          if text == original:
              raise SystemExit('No se produjeron cambios en manual.md')
          manual_path.write_text(text, encoding='utf-8')

          audits = sorted(Path('content/la-puebla/tema-10').glob('auditoria-transversal*.md'))
          if not audits:
              raise SystemExit('No se encontró la auditoría transversal del Tema 10')
          audit_path = audits[-1]
          audit = audit_path.read_text(encoding='utf-8')
          marker = '## Actualización editorial · 27 de julio de 2026'
          if marker not in audit:
              audit = audit.rstrip() + """

## Actualización editorial · 27 de julio de 2026

- Corregida la contradicción del apartado final: el banco contiene 12 preguntas aprobadas y trazables.
- Normalizados el título principal y el estado visible a `PUBLICADO`.
- Retirados los metadatos internos de aprobación y el apartado `Estado real`.
- Corregida la jerarquía de los encabezados `PARTE`, que dejan de competir con el único título principal.

## Incidencias pendientes

- Homogeneizar las llamadas destacadas con el patrón editorial común.
- Validar sistemáticamente los enlaces internos y comprobar el esquema final de repaso.
"""
              audit_path.write_text(audit, encoding='utf-8')

          review_path = Path('TRANSVERSAL_REVIEW.md')
          review = review_path.read_text(encoding='utf-8')
          old_row = '| 10 | EN_REVISION | TRLRHL 6–12 y LGT 17–76 y 117–140 reconfirmados con BOE; matriz actualizada a 27/07/2026 y banco de 12 preguntas verificado; el manual afirma erróneamente que las preguntas no están creadas | Corregir la contradicción del manual y normalizar portada, encabezados, llamadas y enlaces preservando numeración y trazabilidad |'
          new_row = '| 10 | EN_REVISION | TRLRHL 6–12 y LGT 17–76 y 117–140 reconfirmados con BOE; matriz y banco de 12 preguntas verificados; contradicción del banco corregida; título, estado visible y jerarquía de partes normalizados | Homogeneizar llamadas destacadas, validar enlaces internos y comprobar el esquema final de repaso |'
          if old_row not in review:
              raise SystemExit('No se encontró la fila esperada del Tema 10')
          review = review.replace(old_row, new_row, 1)
          review = review.replace(
              'Quince manuales conservan todavía elementos históricos que no aportan contenido de examen; los Temas 11, 13, 14 y 15 ya tienen portada y estado visible normalizados:',
              'Catorce manuales conservan todavía elementos históricos que no aportan contenido de examen; los Temas 10, 11, 13, 14 y 15 ya tienen portada y estado visible normalizados:',
              1,
          )
          review = review.replace(
              'En los Temas 11 a 19 se confirmó una contradicción verificable: sus manuales declaraban vacío un banco que ya contenía 12 preguntas. La contradicción ha quedado corregida en todos esos temas. En el Tema 10 permanece una contradicción equivalente en su apartado final: declara que las preguntas no están creadas, aunque el banco contiene 12 preguntas aprobadas.',
              'En los Temas 10 a 19 se confirmó una contradicción verificable entre el estado declarado del banco y los 12 ejercicios existentes. La contradicción ha quedado corregida en todos esos temas.',
              1,
          )
          review_path.write_text(review, encoding='utf-8')
          PY

          git rm .github/workflows/normalizar-tema10-once.yml
          git config user.name "opoweb-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/la-puebla/tema-10/manual.md content/la-puebla/tema-10/auditoria-transversal*.md TRANSVERSAL_REVIEW.md
          git commit -m "auditoria: normaliza Tema 10 y corrige estado del banco"
          git push
