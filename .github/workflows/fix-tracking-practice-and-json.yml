name: Reparar seguimiento práctica y JSON

on:
  push:
    paths:
      - tools/fix-tracking-practice-and-json.mjs
      - .github/workflows/fix-tracking-practice-and-json.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar reparación
        run: node tools/fix-tracking-practice-and-json.mjs

      - name: Validar JSON
        run: node -e "const fs=require('fs'),path=require('path'); const walk=d=>fs.existsSync(d)?fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]):[]; for(const f of [...walk('data'),...walk('content')].filter(f=>f.endsWith('.json'))) JSON.parse(fs.readFileSync(f,'utf8'));"

      - name: Publicar cambios
        run: |
          if git diff --quiet; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/practice.js assets/runtime-enhancements.js data content
          git commit -m "fix: repara seguimiento práctica y JSON"
          git push
