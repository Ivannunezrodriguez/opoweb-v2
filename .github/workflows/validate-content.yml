name: Validación OpoWeb bajo demanda

# El único CI automático es validate.yml: cubre todos los commits a main.
# Este segundo flujo se conserva para ejecutar manualmente una segunda comprobación.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ejecutar validación integral
        run: npm run test:all
