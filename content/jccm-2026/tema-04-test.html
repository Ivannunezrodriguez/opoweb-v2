<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test JCCM C2 · Tema 4</title><link rel="stylesheet" href="../../assets/styles.css"><style>main{width:min(850px,calc(100% - 2rem));margin:1rem auto}fieldset{margin:1rem 0;padding:1rem}label{display:block;padding:.5rem}button{margin:.5rem;padding:.7rem}</style></head><body><header class="site-header"><h1>Tema 4 · Relaciones interadministrativas</h1><p>30 preguntas de entrenamiento · Pendientes de cotejo individual · Sin penalización oficial</p></header><nav class="site-nav"><a href="programas.html">Temario</a><a href="tema-04-manual.md">Manual</a><a href="tema-04-ficha.md">Ficha rápida</a></nav><main><p id="status" role="status">Cargando preguntas…</p><form id="quiz" hidden><div id="questions"></div><button type="submit">Corregir</button><button type="reset">Reiniciar</button></form></main><script type="module">
const form=document.querySelector('#quiz'),root=document.querySelector('#questions'),status=document.querySelector('#status');
try{
const response=await fetch('tema-04-preguntas.json');if(!response.ok)throw Error('HTTP '+response.status);
const bank=await response.json(),questions=bank.preguntas;
if(questions.length!==30||questions.some(q=>q.opciones.length!==4||!Number.isInteger(q.correcta)||q.correcta<0||q.correcta>3))throw Error('Banco inválido');
questions.forEach((q,i)=>{const f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent=(i+1)+'. '+q.pregunta;f.append(l);q.opciones.forEach((o,k)=>{const label=document.createElement('label'),radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=k;label.append(radio,document.createTextNode(' '+o));f.append(label)});const feedback=document.createElement('p');feedback.hidden=true;feedback.id='feedback'+i;f.append(feedback);root.append(f)});
form.hidden=false;status.textContent='30 preguntas disponibles · entrenamiento provisional';
form.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(form);let hits=0,blank=0;questions.forEach((q,i)=>{const answer=data.get('q'+i),ok=answer===String(q.correcta);if(ok)hits++;if(answer===null)blank++;const f=document.querySelector('#feedback'+i);f.hidden=false;f.textContent=(ok?'Correcta. ':answer===null?'En blanco. ':'Incorrecta. ')+q.opciones[q.correcta]+' · '+q.justificacion+' · '+q.referencia});status.textContent=hits+'/30 aciertos · '+(30-hits-blank)+' errores · '+blank+' en blanco';status.scrollIntoView({block:'center'})});
form.addEventListener('reset',()=>{status.textContent='30 preguntas disponibles · entrenamiento provisional';root.querySelectorAll('[id^=feedback]').forEach(f=>{f.hidden=true;f.textContent=''})});
}catch(e){status.textContent='No se pudo cargar el banco. Vuelve a intentarlo.'}
</script></body></html>
